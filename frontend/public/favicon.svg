<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Navy background -->
  <rect width="64" height="64" rx="13" fill="#1b2b4b"/>
  <!-- Gold corner accent -->
  <polygon points="42,0 64,0 64,22" fill="#c9a84c" opacity="0.4"/>

  <!-- P — stem -->
  <rect x="10" y="18" width="5.5" height="28" rx="2" fill="#d4a93c"/>
  <!-- P — top bar -->
  <rect x="10" y="18" width="18" height="5" rx="2" fill="#d4a93c"/>
  <!-- P — mid bar -->
  <rect x="10" y="29" width="17" height="5" rx="2" fill="#d4a93c"/>
  <!-- P — bowl right -->
  <rect x="24" y="18" width="4" height="16" rx="2" fill="#d4a93c"/>

  <!-- B — stem -->
  <rect x="32" y="18" width="5.5" height="28" rx="2" fill="#d4a93c"/>
  <!-- B — top bar -->
  <rect x="32" y="18" width="15" height="4.5" rx="2" fill="#d4a93c"/>
  <!-- B — mid bar -->
  <rect x="32" y="29" width="14" height="4.5" rx="2" fill="#d4a93c"/>
  <!-- B — bottom bar -->
  <rect x="32" y="41.5" width="15" height="4.5" rx="2" fill="#d4a93c"/>
  <!-- B — upper bowl right -->
  <rect x="43" y="18" width="4" height="15.5" rx="2" fill="#d4a93c"/>
  <!-- B — lower bowl right -->
  <rect x="43" y="29" width="4" height="17" rx="2" fill="#d4a93c"/>
</svg>
